name: Validate streaming chat

on:
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/validate-streaming-chat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Validate backend syntax and route schema
        run: |
          python -m py_compile server/main.py server/rag.py
          python -c "import json,sys; sys.path.insert(0,'server'); import main; route={'type':'route','title':'Test','summary':'Test summary','recommended_time':'17:00–20:00','duration':'3 hours','pace':'relaxed','stops':[{'time':'17:00','duration':'30 min','title':'A','description':'A stop','tip':''},{'time':'17:30','duration':'30 min','title':'B','description':'B stop','tip':''},{'time':'18:00','duration':'30 min','title':'C','description':'C stop','tip':''}],'reminders':[],'follow_up':''}; assert main._validated_route(json.dumps(route))['type']=='route'; assert json.loads(main._stream_line('status',stage='planning'))['stage']=='planning'"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate frontend syntax
        run: node --check web/app.js
